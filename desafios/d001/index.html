<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens</title>
    <style>
        button {
            font: 12pt Arial;
            padding: 30px;
            margin: 10px;
        }

        button:hover{
            color: blue;
        }
    </style>
</head>

<body>
    <h1>Desafio das mensagens</h1>

    <button onclick="botao1()">Botão 1</button>

    <button onclick="botao2()">Botão 2</button>

    <button onclick="botao3()">Botão 3</button>

    <script>
        function botao1() {
            window.alert('Você clicou no 1° botão')
        }

        function botao2() {
            window.alert('Você clicou no 2° botão')
        }

        function botao3() {
            window.alert('Você clicou no 3° botão')
        }
    </script>
</body>

</html>
