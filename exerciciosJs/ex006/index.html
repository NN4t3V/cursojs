<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiros passos com DOM</title>
    <style>
        body{
            background:#64798C ;
            color: #fff;
            font: normal 18pt Arial;
        }
    </style>
</head>
<body>
    <h1>Iniciando estudos DOM</h1>
    <p>Aqui vai o resultado</p>
    <p>Aprendendo a usar o <strong>DOM</strong> em Javascript</p>
    <div class = "msg">Clique em mim</div>
    <script>
        var corpo = window.document.body
        var p1 = window.document.getElementsByTagName('p')[0]
        window.document.write('Está escrito assim: ' + p1.innerText)
        p1.style.background = 'green'
        // Esse recurso é bastante interessante pois garante simplicidade como mudar a cor de fundo e afins..
        var d = window.document.querySelector('div.msg')
        d.style.background = 'green'
        // querySelector é uma forma mais atual e fácil da seleção.
    </script>
    
</body>
</html>
