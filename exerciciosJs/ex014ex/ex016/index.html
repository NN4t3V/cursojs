<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Contador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Vamos Contar</h1>
    </header>
    <section>
        <div>
            <p>
                Início:
                <input type="number" name="txtinicio" id="txtinicio" min="0">  
            </p>
            <p>Fim: 
                  <input class="espaco" type="number" name="txtfim" id="txtfim" min="0">
            </p>
            <p>Passo:
                <input type="number" name="txtpasso" id="txtpasso">
            </p>
            <p >
                <input id="cor" type="button" value="Contar" onclick="contar()">
            </p>
        </div>
        <div id="res">
            Preparando a contagem...
        </div>
    </section>
    <footer>
        <p>&copy;Curso em vídeo</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
